<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noVNC-iKVM</title>
<link rel="icon" href="launcher-icon.png" type="image/png">
<style>
  :root {
    --bg: #2b2b2b; --panel: #3a3a3a; --text: #f0f0f0; --muted: #b8b8b8;
    --accent: #3c80c8; --accent-hover: #4a90da; --field: #222; --border: #555;
    --error: #e05555;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  main { width: 100%; max-width: 380px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  form { background: var(--panel); border-radius: 10px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input {
    width: 100%; padding: 9px 10px; margin: 0 0 14px;
    background: var(--field); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  button {
    width: 100%; padding: 10px; border: 0; border-radius: 6px;
    background: var(--accent); color: white; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  .error { color: var(--error); min-height: 1.4em; margin: -6px 0 8px; font-size: 13px; }
  #recent { margin-top: 18px; }
  #recent h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  #recent ul { list-style: none; margin: 0; padding: 0; }
  #recent li { display: flex; align-items: center; gap: 6px; }
  #recent a {
    flex: 1; display: block; padding: 6px 8px; border-radius: 6px;
    color: var(--text); text-decoration: none;
  }
  #recent a:hover, #recent a:focus { background: var(--panel); }
  #recent .user { color: var(--muted); font-size: 13px; }
  #recent .forget {
    width: auto; padding: 2px 8px; background: transparent; color: var(--muted); font-weight: normal;
  }
  #recent .forget:hover { color: var(--text); background: var(--panel); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1><img src="launcher-icon.png" alt="" width="40" height="40" style="vertical-align:middle;margin-right:10px">noVNC-iKVM</h1>
  <p class="sub">Remote console for IPMI / BMC hosts</p>
  <form id="connect" autocomplete="on">
    <label for="host">BMC address</label>
    <input id="host" name="host" placeholder="10.0.0.10 or bmc.example.com" required
           autocapitalize="off" spellcheck="false" list="recent-hosts">
    <datalist id="recent-hosts"></datalist>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" value="ADMIN"
           autocapitalize="off" spellcheck="false">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <div class="error" id="error" role="alert"></div>
    <button type="submit">Connect</button>
  </form>
  <section id="recent" hidden>
    <h2>Recent</h2>
    <ul id="recent-list"></ul>
  </section>
  <p class="hint">Paste into the console with Ctrl+Shift+V. Closing this window ends the program.</p>
</main>
<script type="module" src="launcher.js"></script>
</body>
</html>
